<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motion Bird</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <!-- Webcam -->
    <video id="webcam" autoplay muted playsinline></video>

    <!-- HUD -->
    <div id="hud">

        <div class="title">
            MOTION BIRD
        </div>

        <div class="status" id="status">
            Starting camera...
        </div>

        <div class="controls">

            <div class="control">
                <span>FLAP</span>
                <div class="bar">
                    <div id="flapBar"></div>
                </div>
            </div>

            <div class="control">
                <span>TURN</span>
                <div class="bar">
                    <div id="turnBar"></div>
                </div>
            </div>

            <div class="control">
                <span>SPEED</span>
                <div class="bar">
                    <div id="speedBar"></div>
                </div>
            </div>

        </div>

    </div>

    <script type="module" src="./game.js"></script>

</body>
</html>
